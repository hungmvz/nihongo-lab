<!doctype html>

  <head>

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- ?v=3662b22a: mã băm của public/icon.svg (vite.config) — đổi icon là đổi URL, iOS không dùng lại icon cũ trong cache -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png?v=3662b22a" />
    <!-- Chạy toàn màn hình khi mở từ màn hình chính: thẻ chuẩn (Chrome báo thẻ apple-… đã lỗi thời) + thẻ apple-… cho iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Giao diện nền sáng: "default" để chữ thanh trạng thái iOS tối trên nền sáng (black-translucent luôn cho chữ trắng) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Tên dưới icon khi "Thêm vào MH chính" trên iPhone — giữ giống <title> (có test kiểm tra). -->
    <meta name="apple-mobile-web-app-title" content="Học tiếng Nhật" />
    <title>Học tiếng Nhật</title>
    <!-- Màn "Đang cập nhật…" khi cài bản mới (xem src/app/updateSplash.ts). Nằm sẵn trong HTML để trang mới hiện nó
         ngay từ khung hình đầu, nên lần tải lại không làm nháy màn hình. Màu lấy đúng bảng zinc/brand (rose) của app — đổi màu chính thì sửa cả ở đây. -->
    <style>#nl-update-splash{display:none}.nl-updating #nl-update-splash{z-index:2147483647;color:oklch(55.2% .016 285.938);background:oklch(98.5% 0 0);flex-direction:column;justify-content:center;align-items:center;gap:14px;font:500 15px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;transition:opacity .25s ease-out;display:flex;position:fixed;inset:0}.nl-updating-out #nl-update-splash{opacity:0}#nl-update-splash svg{width:32px;height:32px;animation:.9s linear infinite nl-spin;animation-delay:var(--nl-spin-delay,0s)}#nl-update-splash .track{stroke:oklch(92% .004 286.32)}#nl-update-splash .arc{stroke:oklch(64.5% .246 16.439)}@keyframes nl-spin{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){.nl-updating #nl-update-splash{color:oklch(70.5% .015 286.067);background:oklch(14.1% .005 285.823)}#nl-update-splash .track{stroke:oklch(27.4% .006 286.033)}#nl-update-splash .arc{stroke:oklch(71.2% .194 13.428)}}@media (prefers-reduced-motion:reduce){#nl-update-splash svg{animation:none}}</style>
    <script>
      // Vừa cài bản mới (cờ do src/app/updateSplash.ts đặt trước khi tải lại): hiện màn "Đang cập nhật…" ngay.
      // Xoá cờ luôn, để lần tải lại sau không hiện nữa. Nếu app lỗi không gỡ được màn che thì 15 giây sau tự gỡ.
      ;(function () {
        try {
          if (!sessionStorage.getItem('nl-updating')) return
          sessionStorage.removeItem('nl-updating')
          var h = document.documentElement
          h.classList.add('nl-updating')
          h.style.setProperty('--nl-spin-delay', -(Date.now() % 900) + 'ms')
          setTimeout(function () {
            h.classList.remove('nl-updating', 'nl-updating-out')
          }, 15000)
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-DIlKg5ha.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/error-DwLpsZPe.js">

  <body>

      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" aria-hidden="true">
        <circle class="track" cx="12" cy="12" r="9.5" />
        <path class="arc" d="M12 2.5a9.5 9.5 0 0 1 9.5 9.5" />
      </svg>
      <span>Đang cập nhật…</span>

    <!-- ?v=3662b22a: mã băm của public/icon.svg (vite.config) — đổi icon là đổi URL, iOS không dùng lại icon cũ trong cache -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png?v=3662b22a" />
    <!-- Chạy toàn màn hình khi mở từ màn hình chính: thẻ chuẩn (Chrome báo thẻ apple-… đã lỗi thời) + thẻ apple-… cho iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Giao diện nền sáng: "default" để chữ thanh trạng thái iOS tối trên nền sáng (black-translucent luôn cho chữ trắng) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Tên dưới icon khi "Thêm vào MH chính" trên iPhone và title tab: Học tiếng Nhật = APP_NAME (src/app/appName.ts),
         vite.config.ts điền vào lúc chạy dev/build. -->
    <meta name="apple-mobile-web-app-title" content="Học tiếng Nhật" />
    <title>Học tiếng Nhật</title>
    <!-- Màn che toàn trang lúc app chưa vẽ xong (xem src/app/updateSplash.ts): màn khởi động (icon あ) mỗi lần
         mở app, hoặc màn "Đang cập nhật…" khi vừa cài bản mới. Nằm sẵn trong HTML nên hiện ngay từ khung hình đầu, không
         còn cảnh trang trắng / chữ "Đang tải…" nháy qua. Màu lấy đúng bảng zinc/brand (rose) của app — đổi màu chính thì
         sửa cả ở đây. -->
    <style>#nl-launch,#nl-update-splash{display:none}.nl-launch #nl-launch,.nl-updating #nl-update-splash{z-index:2147483647;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:oklch(98.5% 0 0);flex-direction:column;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;transition:opacity .25s ease-out;display:flex;position:fixed;inset:0}.nl-splash-out #nl-launch,.nl-splash-out #nl-update-splash{opacity:0}#nl-launch .nl-icon{border-radius:22.5%;width:76px;height:76px;animation:.2s ease-out 80ms both nl-splash-in;display:block}@keyframes nl-splash-in{0%{opacity:0}}#nl-update-splash{color:oklch(55.2% .016 285.938);gap:14px;font-size:15px;font-weight:500;line-height:1.4}#nl-update-splash svg{width:32px;height:32px;animation:.9s linear infinite nl-spin;animation-delay:var(--nl-spin-delay,0s);display:block}#nl-update-splash .track{stroke:oklch(92% .004 286.32)}#nl-update-splash .arc{stroke:oklch(64.5% .246 16.439)}@keyframes nl-spin{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){.nl-launch #nl-launch,.nl-updating #nl-update-splash{background:oklch(14.1% .005 285.823)}#nl-launch .nl-icon{box-shadow:0 0 0 1px oklch(100% 0 0/.14)}#nl-update-splash{color:oklch(70.5% .015 286.067)}#nl-update-splash .track{stroke:oklch(27.4% .006 286.033)}#nl-update-splash .arc{stroke:oklch(71.2% .194 13.428)}}@media (prefers-reduced-motion:reduce){#nl-update-splash svg,#nl-launch .nl-icon{animation:none}}</style>
    <script>
      // Chọn màn che: vừa cài bản mới (cờ do src/app/updateSplash.ts đặt trước khi tải lại, giá trị = lúc màn cập nhật
      // bắt đầu hiện) → màn "Đang cập nhật…"; không → màn khởi động. Xoá cờ luôn để lần tải lại sau không hiện nữa.
      // App vẽ xong thì hideSplash() gỡ màn che; nếu app lỗi không gỡ được thì 15 giây sau tự gỡ.
      ;(function () {
        var h = document.documentElement
        try {
          var since = sessionStorage.getItem('nl-updating')
          if (since) {
            sessionStorage.removeItem('nl-updating')
            h.classList.add('nl-updating')
            h.setAttribute('data-splash-since', since)
            h.style.setProperty('--nl-spin-delay', -(Date.now() % 900) + 'ms')
          } else h.classList.add('nl-launch')
        } catch (e) {
          h.classList.add('nl-launch')
        }
        setTimeout(function () {
          h.classList.remove('nl-updating', 'nl-launch', 'nl-splash-out')
        }, 15000)
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-PaY4Uxcu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/error-DwLpsZPe.js">

          <path d="M65.63,44.12c0.75,1.12,1.16,4.39,0.5,6.12c-4.62,12.26-11.24,23.76-25.37,35.76c-6.86,5.83-15.88,3.75-16.25-8.38c-0.34-10.87,13.38-23.12,32.38-26.74c12.42-2.37,27,1.38,30.5,12.75c4.05,13.18-3.76,26.37-20.88,30.49" />
        </g>

    <style>#nl-launch,#nl-update-splash{display:none}.nl-launch #nl-launch,.nl-updating #nl-update-splash{z-index:2147483647;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:oklch(98.5% 0 0);flex-direction:column;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;transition:opacity .25s ease-out;display:flex;position:fixed;inset:0}.nl-splash-out #nl-launch,.nl-splash-out #nl-update-splash{opacity:0}#nl-launch .nl-icon{width:76px;height:152px;animation:0s .25s both nl-splash-show;display:block}@keyframes nl-splash-show{0%{opacity:0}}#nl-update-splash{color:oklch(55.2% .016 285.938);gap:14px;font-size:15px;font-weight:500;line-height:1.4}#nl-update-splash svg{width:32px;height:32px;animation:.9s linear infinite nl-spin;animation-delay:var(--nl-spin-delay,0s);display:block}#nl-update-splash .track{stroke:oklch(92% .004 286.32)}#nl-update-splash .arc{stroke:oklch(64.5% .246 16.439)}@keyframes nl-spin{to{transform:rotate(360deg)}}@media (prefers-color-scheme:dark){.nl-launch #nl-launch,.nl-updating #nl-update-splash{background:oklch(14.1% .005 285.823)}#nl-launch .nl-ring{stroke:oklch(100% 0 0/.14)}#nl-update-splash{color:oklch(70.5% .015 286.067)}#nl-update-splash .track{stroke:oklch(27.4% .006 286.033)}#nl-update-splash .arc{stroke:oklch(71.2% .194 13.428)}}@media (prefers-reduced-motion:reduce){#nl-update-splash svg,#nl-launch .nl-icon{animation:none}}</style>
    <script>
      // Chọn màn che: vừa cài bản mới (cờ do src/app/updateSplash.ts đặt trước khi tải lại, giá trị = lúc màn cập nhật
      // bắt đầu hiện) → màn "Đang cập nhật…"; không → màn khởi động. Xoá cờ luôn để lần tải lại sau không hiện nữa.
      // App vẽ xong thì hideSplash() gỡ màn che; nếu app lỗi không gỡ được thì 15 giây sau tự gỡ.
      ;(function () {
        // Màn khởi động của web (#nl-launch): đang TẮT — iPhone dùng ảnh khởi động tĩnh (apple-touch-startup-image) do
        // iOS tự vẽ, như app gốc. Bật lại: đổi thành true.
        var LAUNCH_SPLASH = false
        var h = document.documentElement
        try {
          var since = sessionStorage.getItem('nl-updating')
          if (since) {
            sessionStorage.removeItem('nl-updating')
            h.classList.add('nl-updating')
            h.setAttribute('data-splash-since', since)
            h.style.setProperty('--nl-spin-delay', -(Date.now() % 900) + 'ms')
          } else if (LAUNCH_SPLASH) h.classList.add('nl-launch')
        } catch (e) {
          if (LAUNCH_SPLASH) h.classList.add('nl-launch')
        }
        setTimeout(function () {
          h.classList.remove('nl-updating', 'nl-launch', 'nl-splash-out')
        }, 15000)
      })()
    </script>
